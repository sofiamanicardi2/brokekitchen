 d.steps.forEach(function(_,i){h+='<i class="'+(i<G.si||(i===G.si&&G.ph==='done')?'on':i===G.si?'cur':'')+'"></i>'});
 h+='</div><b class="t" style="font-size:16px;flex:1;text-align:right">'+d.n+'</b></div>';
 if(G.ph==='intro')return h+'<div class="bubble"><b>Next Step!</b><br>'+s.txt+'<small>'+HOW[s.k]+'</small></div>'+kid('happy','c')+'<button onclick="cd(3)">OK</button>';
 if(G.ph==='cd')return h+'<div class="bubble" style="margin-top:30px">Pay attention!</div><div class="t" style="font-size:96px;margin:20px 0">'+G.cn+'</div>';
 if(G.ph==='done'){h+='<div class="fb">FINISHED!</div>'+kid(G.s2>1?'happy':'sad','c')+'<div>';for(var i=0;i<3;i++)h+='<img class="cn" style="width:44px;height:44px" src="'+(i<G.s2?STAR:STG)+'" alt="">';
  return h+'</div><div class="cap">'+G.msg+'</div><button onclick="next()">'+(G.si<n-1?'Next step':'Serve it!')+'</button>'}
 h+='<div class="cap">'+s.txt+'</div><div class="stage'+(s.k==='drop'?' drop':'')+'" id="stg" data-a="'+(s.k==='cut'||s.k==='stir'?s.k:'')+'">'+stage()+'</div>';
 if(s.k==='hold')h+='<div class="hint" id="hint">Press and hold the button below!</div>';if(s.k!=='drop')h+='<div class="pg">'+(s.k==='hold'?'<b style="left:'+s.lo+'%;width:'+(s.hi-s.lo)+'%"></b>':'')+'<i id="mf"></i></div>';
 if(s.k==='hold')h+='<button class="big" data-a="hold">HOLD here to cook!</button>';
 else if(s.k!=='drop')h+='<button class="big alt" data-a="tap">Or tap here</button>';
 return h}
function draw(){var d=D[S.i],h='';
 if(S.s==='intro')h='<h1>Press<br>Start Menu</h1><div class="bubble">Pause the game, not your dinner! Cook famous video game dishes step by step.<small>#PressStartMenu</small></div>'+kid('happy','c')+'<button onclick="go(\'menu\')">Start</button>';
 else if(S.s==='menu'){var n=0;for(var k in S.done)n++;h='<div class="curtain"><h2>MENU</h2></div>';
  D.forEach(function(x,i){var c=S.done[i];h+='<button class="dish" onclick="pick('+i+')">'+sp(x.ing[0])+'<span style="flex:1">'+x.n+'<b>'+x.g+(c?' · unlocked':'')+'</b></span>'+coins(c||0)+'</button>'});
  if(n===D.length)h+='<button onclick="go(\'end\')">See my score</button>'}
 else if(S.s==='cook'){h='<div class="top"><button class="alt" onclick="go(\'menu\')">Menu</button></div>'+cook();app.innerHTML=h;var c=$('ck');if(c)c.style.setProperty('--p','100%');return}
 else if(S.s==='win'){h='<h2>Game dish<br>unlocked! <img class="spark cn" src="'+STAR+'" alt=""></h2>'+(d.img?'<img class="dimg" src="'+d.img+'" alt="">':'<div class="plate" style="'+PS+'">'+d.ing.map(function(k){return '<div class="slot on">'+sp(k)+'</div>'}).join('')+'</div>')+'<div class="t" style="font-size:26px">'+d.n+'</div><div class="stats">Energy: '+d.en+'%<div class="bar"><i style="width:'+d.en*4+'%"></i></div>Pans to wash: 1 · Time: '+d.t+' minutes<br>'+coins(S.coins)+'</div><div class="bubble">Send this to the '+d.share+'</div>'+kid('happy','c')+'<button onclick="share()">Send</button>'+(S.i<D.length-1?'<button class="alt" onclick="pick('+(S.i+1)+')">Next dish</button>':'<button class="alt" onclick="go(\'end\')">Finish</button>')+'<button class="alt" onclick="pick('+S.i+')">Cook again</button><button class="alt" onclick="go(\'menu\')">Menu</button>'}
 else{var t=0;for(var k2 in S.done)t+=S.done[k2];h='<h2>All dishes<br>unlocked!</h2><div class="stats" style="font-size:22px">Score: '+t+' / '+D.length*3+' coins</div>'+kid('happy','c')+'<div class="bubble">Send this to a friend who is forever undecided on food</div><button onclick="S.i=0;share()">Send</button><button class="alt" onclick="S.done={};go(\'menu\')">Play again</button>'}
 app.innerHTML=h}
var AC=null,MUTE=false,MU=null,mi=0,SZ=null,NB=null,lastFx=0;
function au(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d,ty,v,t0,f2){var a=MUTE?null:au();if(!a)return;var o=a.createOscillator(),g=a.createGain(),t=a.currentTime+(t0||0);o.type=ty||'square';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v||.07,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02)}
function nbuf(){if(!NB){var a=au();NB=a.createBuffer(1,a.sampleRate,a.sampleRate);var d=NB.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1}return NB}
function noise(d,v,fq){var a=MUTE?null:au();if(!a)return;var s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain(),t=a.currentTime;s.buffer=nbuf();f.type='bandpass';f.frequency.value=fq;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d)}
function sizz(on){if(SZ){try{SZ.s.stop()}catch(e){}SZ=null}if(!on||MUTE)return;var a=au();if(!a)return;var s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=nbuf();s.loop=true;f.type='highpass';f.frequency.value=2500;g.gain.value=.05;s.connect(f);f.connect(g);g.connect(a.destination);s.start();SZ={s:s,f:f}}
function fx(k){var n=performance.now();if(n-lastFx<80)return;lastFx=n;if(k==='cut')noise(.06,.25,2500+Math.random()*1500);else if(k==='stir')tone(180+Math.random()*80,.08,'triangle',.08)}
function seq(a,ty,gap,v){a.forEach(function(f,i){tone(f,.16,ty||'square',v||.07,i*(gap||.11))})}
function jingle(sc){if(sc>=3)seq([523,659,784,1047]);else if(sc===2)seq([523,659,784]);else if(sc===1)seq([392,330],'triangle',.18);else seq([196,147,110],'sawtooth',.18)}
function fanfare(){seq([523,523,523,659,784,659,784,1047],'square',.13)}
var MEL=[523,659,784,659,587,698,880,698,523,659,784,1047,988,784,659,587],BAS=[131,131,175,175,147,147,196,196];
function musicStart(){if(!MU&&!MUTE&&au())MU=setInterval(function(){tone(MEL[mi%16],.16,'square',.02);if(mi%2===0)tone(BAS[(mi>>1)%8],.3,'triangle',.045);mi++},230)}
function toggleSnd(){MUTE=!MUTE;var b=$('snd');b.textContent='Sound: '+(MUTE?'off':'on');b.setAttribute('aria-pressed',String(!MUTE));if(MUTE){clearInterval(MU);MU=null;sizz(0)}else musicStart()}
draw();
